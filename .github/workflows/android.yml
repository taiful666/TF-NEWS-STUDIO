name: Build Android APK

on:
  push:
    branches: [mobile-app, main]
    paths:
      - 'mobile/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the mobile app inside the Android project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp mobile/index.html android/app/src/main/assets/www/index.html

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "error:|e: |What went wrong|FAILED|Could not|AAPT|Exception" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TF-News-Studio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TF-News-Studio-apk
          path: TF-News-Studio.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: TF News Studio Android v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            TF News Studio মোবাইল অ্যাপ (Android)।
            ফোনে ডাউনলোড করে ইনস্টল করুন: TF-News-Studio.apk
          files: TF-News-Studio.apk
