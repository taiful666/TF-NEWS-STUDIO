plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.tfnews.studio'
    compileSdk 34

    defaultConfig {
        applicationId "com.tfnews.studio"
        minSdk 29
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        test {
            storeFile file('tf-test.keystore')
            storePassword 'tfnews123'
            keyAlias 'tfnews'
            keyPassword 'tfnews123'
        }
        // permanent private key: comes from GitHub Secrets during the build (never stored in the code)
        permanent {
            storeFile file('release.jks')
            storePassword System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
            keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "tfnewsstudio"
            keyPassword System.getenv("ANDROID_KEYSTORE_PASS") ?: ""
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
            signingConfig file('release.jks').exists() ? signingConfigs.permanent : signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
